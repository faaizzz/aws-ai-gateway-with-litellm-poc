    model_id: eu.anthropic.claude-haiku-4-5-20251001-v1:0
    inference_profile: true
    region: eu-central-1
    profile_regions:
      - eu-central-1
      - eu-north-1
      - eu-south-1
      - eu-south-2
      - eu-west-1
      - eu-west-3
