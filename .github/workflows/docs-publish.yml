name: docs publish (manual)

# Builds the Antora site and, optionally, publishes it to S3/CloudFront.
# Manual only: no push or PR trigger.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to S3/CloudFront (main only). false = build and upload an artifact only."
        required: true
        type: boolean
        default: true

permissions:
  id-token: write # required for OIDC to AWS (aws-actions/configure-aws-credentials)
  contents: read

concurrency:
  group: docs-publish
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  # Keep in sync with the "Build locally" section of asci-doc/README.md.
  KRAMDOWN_ASCIIDOC_VERSION: "2.1.1"

jobs:
  build:
    name: build Antora site
    runs-on: ubuntu-latest
    steps:
      - name: Check publish preconditions
        if: inputs.publish
        env:
          DOCS_ROLE: ${{ secrets.AWS_DOCS_ROLE_ARN }}
          DOCS_BUCKET: ${{ vars.DOCS_BUCKET }}
          DOCS_DISTRIBUTION_ID: ${{ vars.DOCS_DISTRIBUTION_ID }}
          DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Publishing is only allowed from main (this run is on $GITHUB_REF). Re-run with publish=false or dispatch from main."
            exit 1
          fi
          missing=""
          [ -n "$DOCS_ROLE" ] || missing="$missing secret AWS_DOCS_ROLE_ARN"
          [ -n "$DOCS_BUCKET" ] || missing="$missing variable DOCS_BUCKET"
          [ -n "$DOCS_DISTRIBUTION_ID" ] || missing="$missing variable DOCS_DISTRIBUTION_ID"
          [ -n "$DOCS_SITE_URL" ] || missing="$missing variable DOCS_SITE_URL"
          if [ -n "$missing" ]; then
            echo "::error::Missing:$missing. See terraform/bootstrap/README.md (Docs site)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22" # asci-doc/package.json engines: >=20
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "3.3"
      - run: gem install kramdown-asciidoc -v "$KRAMDOWN_ASCIIDOC_VERSION"
      - run: npm ci
        working-directory: asci-doc
      - name: Build site
        env:
          MMDC_PUPPETEER_CONFIG: asci-doc/puppeteer-config.json
          DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
        run: asci-doc/scripts/build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: asci-doc/build/site
          if-no-files-found: error

  publish:
    name: publish to S3 and CloudFront
    needs: build
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-site
          path: site
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DOCS_ROLE_ARN }}
          aws-region: eu-central-1
      - name: Sync to S3 and invalidate CloudFront
        env:
          DOCS_BUCKET: ${{ vars.DOCS_BUCKET }}
          DOCS_DISTRIBUTION_ID: ${{ vars.DOCS_DISTRIBUTION_ID }}
          DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
        run: |
          aws s3 sync site "s3://$DOCS_BUCKET" --delete
          aws cloudfront create-invalidation --distribution-id "$DOCS_DISTRIBUTION_ID" --paths '/*'
          echo "Docs site: $DOCS_SITE_URL" >> "$GITHUB_STEP_SUMMARY"
