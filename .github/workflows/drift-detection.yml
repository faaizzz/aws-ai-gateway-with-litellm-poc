name: drift detection (scheduled, read-only)

# Catches an out-of-band change or a perpetual diff between PR-triggered
# plans.

on:
  schedule:
    # Once daily at midnight UTC - not tied to any real SLA for this PoC.
    - cron: "0 0 * * *"
  workflow_dispatch: {} # lets a human trigger a drift check on demand too

permissions:
  id-token: write # required for OIDC to AWS (aws-actions/configure-aws-credentials)
  contents: read

env:
  # Keep in sync with terraform.yml's TF_VERSION.
  TF_VERSION: "1.16.4"

jobs:
  drift-check:
    name: "terraform plan -detailed-exitcode (read-only, never applies)"
    runs-on: ubuntu-latest
    # Same gate as terraform.yml's plan job: skipped unless the repository
    # variable AWS_PLAN_ENABLED is "true".
    if: vars.AWS_PLAN_ENABLED == 'true'
    env:
      TF_VAR_langfuse_public_key: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      TF_VAR_langfuse_secret_key: ${{ secrets.LANGFUSE_SECRET_KEY }}
      TF_VAR_langfuse_host: ${{ vars.LANGFUSE_HOST }}
      # Same reasoning as terraform.yml: an unset repository variable
      # becomes TF_VAR_ci_*_role_arn="".
      TF_VAR_ci_plan_role_arn: ${{ secrets.AWS_PLAN_ROLE_ARN }}
      TF_VAR_ci_apply_role_arn: ${{ secrets.AWS_APPLY_ROLE_ARN }}
      # JSON list of stable operator IAM ARNs allowed to read the secrets.
      # Falls back to [] because an unset variable would render an empty string,
      # which is not a valid list(string). GitHub upper-cases variable names;
      # Terraform needs the lower-case TF_VAR_ name.
      TF_VAR_local_operator_arns: ${{ vars.LOCAL_OPERATOR_ARNS || '[]' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
      # The read-only PLAN role, never the apply role - this workflow
      # has no apply step at all.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: eu-central-1
      - run: terraform -chdir=terraform/environments/dev init
      # Detailed-exitcode: 0 = no changes, 1 = error, 2 = changes
      # present.
      - run: terraform -chdir=terraform/environments/dev plan -detailed-exitcode -no-color
